name: Release
on:
  push:
    branches:
      - master
      - next

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
      - run: vp i -g pnpm

      - run: vp install
      - run: vp check
      - run: vp test
      - run: vp pack

      - name: Setup git user
        run: |
          git config user.name "${{ vars.GIT_USER }}"
          git config user.email "${{ vars.GIT_EMAIL }}"

      # `next` publishes prereleases (x.y.z-beta.0, -beta.1, ...) under the npm dist-tag `next`.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_TAG: ${{ github.ref_name == 'next' && 'next' || 'latest' }}
          PREID: ${{ github.ref_name == 'next' && 'beta' || '' }}
        run: vpx nx release -y --preid "$PREID"
